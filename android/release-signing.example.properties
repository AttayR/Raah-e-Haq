# Android release signing (Raah-e-Haq). EXAMPLE ONLY: placeholders, no real values.
#
# Copy these four lines into ~/.gradle/gradle.properties on the build machine (outside the
# repo), or export them as environment variables with the same names (CI secrets).
# Never put real values in android/gradle.properties or anywhere else in the repo.
#
# A release build (assembleRelease / bundleRelease / installRelease) fails with a clear
# message when any of them is missing. It is never signed with the debug key.
# Debug builds don't need them.
#
# Owner steps (B-05): docs/RELEASE_NOTES_OWNER.md

# Absolute path to the upload keystore (relative paths resolve against android/app).
RH_UPLOAD_STORE_FILE=/absolute/path/to/raahehaq-upload.jks
RH_UPLOAD_STORE_PASSWORD=change-me
RH_UPLOAD_KEY_ALIAS=raahehaq-upload
RH_UPLOAD_KEY_PASSWORD=change-me
